<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Just in Time</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topo">
        <div class="logo">
            <span>JIT</span>
            <div>
                <h1>Just in Time</h1>
                <small>Gestão da Produção</small>
            </div>
        </div>
        <div class="usuario-menu">
            <span id="nomeUsuario">Usuário</span>
            <button onclick="logout()" class="btn-sair">
                Sair
            </button>
        </div>
    </header>

    <main class="container">
        <div class="pagina-header">
            <div>
                <h2>Cadastro de Produtos</h2>
                <p>
                    Gerencie os produtos e seus níveis de estoque.
                </p>
            </div>
            <a href="index.html" class="btn-voltar">
                ← Voltar
            </a>
        </div>

        <section class="painel">
            <div class="busca">
                <input type="text" id="campoBusca" placeholder="Pesquisar produto...">
                <button onclick="buscarProdutos()" class="btn-secundario">
                    🔍 Buscar
                </button>
                <button onclick="carregarProdutos()" class="btn-limpar">
                    Limpar
                </button>
            </div>
        </section>

        <section class="painel">
            <h3 id="tituloFormulario">
                Cadastrar Produto
            </h3>
            <form id="produtoForm">
                <input type="hidden" id="produtoId">
                <div class="form-grid">
                    <div class="campo">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" placeholder="Nome do produto" required>
                    </div>
                    <div class="campo">
                        <label for="custo">Custo *</label>
                        <input type="number" id="custo" step="0.01" min="0" placeholder="0,00" required>
                    </div>
                    <div class="campo campo-grande">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" placeholder="Descrição do produto">
                    </div>
                    <div class="campo">
                        <label for="quantidade">Estoque *</label>
                        <input type="number" id="quantidade" min="0" placeholder="Quantidade" required>
                    </div>
                    <div class="campo">
                        <label for="estoqueMinimo">Estoque mínimo *</label>
                        <input type="number" id="estoqueMinimo" min="0" placeholder="Estoque mínimo" required>
                    </div>
                </div>
                <div class="form-botoes">
                    <button type="submit" class="btn-principal">
                        Salvar Produto
                    </button>
                    <button type="button" onclick="limparFormulario()" class="btn-limpar">
                        Limpar
                    </button>
                </div>
            </form>
        </section>

        <section class="painel">
            <div class="tabela-header">
                <div>
                    <h3>Produtos cadastrados</h3>
                    <p id="totalProdutos">
                        Carregando...
                    </p>
                </div>
            </div>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Descrição</th>
                            <th>Custo</th>
                            <th>Estoque</th>
                            <th>Mínimo</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutos">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="java/produtos.js"></script>

</body>
</html>
